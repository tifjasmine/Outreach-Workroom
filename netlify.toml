[build]
  command = "./node_modules/.bin/vite build --config vite.netlify.config.ts"
  publish = "netlify-dist"

[[redirects]]
  from = "/api/login"
  to = "/.netlify/functions/login"
  status = 200

[[redirects]]
  from = "/api/airtable"
  to = "/.netlify/functions/airtable"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
